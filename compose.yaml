services:
  api:
    build: .
    restart: unless-stopped
    environment:
      BLOG_ADMIN_TOKEN: ${BLOG_ADMIN_TOKEN:-}
      BLOG_LEGACY_ADMIN: ${BLOG_LEGACY_ADMIN:-false}
      BLOG_SITE_URL: ${BLOG_SITE_URL:-http://localhost:8080}
      BLOG_MEDIA_DIR: /app/media
      BLOG_SMTP_ADDR: ${BLOG_SMTP_ADDR:-}
      BLOG_SMTP_MODE: ${BLOG_SMTP_MODE:-starttls}
      BLOG_SMTP_USER: ${BLOG_SMTP_USER:-}
      BLOG_SMTP_PASSWORD: ${BLOG_SMTP_PASSWORD:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      BLOG_EMAIL_FROM: ${BLOG_EMAIL_FROM:-}
      BLOG_INITIAL_ADMIN_EMAIL: ${BLOG_INITIAL_ADMIN_EMAIL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      BLOG_ALLOW_SHORT_ADMIN_TOKEN: ${BLOG_ALLOW_SHORT_ADMIN_TOKEN:-false}
      BLOG_DATABASE_URL: postgres://blog:${BLOG_DB_PASSWORD:?set BLOG_DB_PASSWORD}@postgres:5432/blog?sslmode=disable
      BLOG_REDIS_URL: redis://redis:6379/0
      BLOG_CACHE_PREFIX: ${BLOG_CACHE_PREFIX:-blog-api}
      BLOG_ALLOWED_ORIGIN: ${BLOG_ALLOWED_ORIGIN:-}
      BLOG_ENABLE_PLAYGROUND: ${BLOG_ENABLE_PLAYGROUND:-false}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media-data:/app/media
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: blog
      POSTGRES_USER: blog
      POSTGRES_PASSWORD: ${BLOG_DB_PASSWORD:?set BLOG_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blog -d blog"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  media-data:
