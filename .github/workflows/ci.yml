name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal)"
      - name: Test
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build -o /tmp/blog-api ./cmd/api
      - name: Build container
        run: docker build -t blog-api:test .
