server {
    listen 80;
    server_name blog.kennyy.tech;
    location /.well-known/acme-challenge/ { root /var/www/blog-api-go; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name blog.kennyy.tech;
    ssl_certificate /etc/letsencrypt/live/blog.kennyy.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blog.kennyy.tech/privkey.pem;
    client_max_body_size 11m;

    location = /account/setup {
        add_header Set-Cookie "offscript_preview=1; Path=/; Secure; HttpOnly; SameSite=Lax; Max-Age=86400" always;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        proxy_pass http://127.0.0.1:8099;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Do not write the one-time setup token into access logs.
        access_log off;
    }

    location / {
        proxy_pass http://$offscript_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
